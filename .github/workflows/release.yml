name: 'Release EnigmaOS Windows'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'x86_64-pc-windows-msvc'

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build frontend
        run: npm run build

      - name: Build and Release with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'EnigmaOS Windows ${{ github.ref_name }}'
          releaseBody: |
            ### 🚀 EnigmaOS Windows Edition ${{ github.ref_name }}
            
            Descargas oficiales para Windows 10 y Windows 11 (64-bit):
            - **Instalador NSIS (`.exe`):** Asistente interactivo de instalación directa.
            - **Paquete MSI (`.msi`):** Instalador para entornos corporativos y estándar de Windows.
            
            ✨ **Novedades de esta versión:**
            - **Detección Precisa y Filtrado Riguroso de Apps Abiertas:** Mapeo de identidad autoritario por ejecutable y clase (`CabinetWClass` para Explorador de Archivos, `ApplicationFrameWindow` para apps UWP como Calculadora/Configuración/Fotos). Eliminada la colisión de títulos de pestañas o documentos contra nombres de apps del sistema.
            - **Protección Anti-Colisiones en el Dock:** El emparejamiento de ventanas en el Dock prioriza la identidad del proceso y clase; nunca confunde una pestaña de navegador ("GitHub Settings") con la app nativa de Configuración.
            - **Win32 AppBar de Alto Rendimiento sin Condiciones de Carrera:** Inicialización atómica segura con guardas de concurrencia, soporte nativo multimonitor con `GetMonitorInfoW` (`rcMonitor`), cálculo preciso de WorkArea ante DPI variable y respuesta inmediata a eventos `ABN_POSCHANGED`.
            - **Unificación de Tecla Windows y Gancho de Bajo Nivel:** Selector de apps unificado con gancho `WH_KEYBOARD_LL` insensible a auto-repetición de teclas y sincronización idéntica en Linux evdev.
          releaseDraft: false
          prerelease: false
          args: ''
