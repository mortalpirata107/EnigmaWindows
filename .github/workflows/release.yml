name: 'Release EnigmaOS Windows & macOS'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''
          - platform: 'macos-latest'
            target: ''
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build frontend
        run: npm run build

      - name: Build and Release with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'EnigmaOS Windows & Mac ${{ github.ref_name }}'
          releaseBody: |
            ### 🚀 EnigmaOS Windows & macOS Release ${{ github.ref_name }}
            
            Descargas oficiales para Windows y macOS:
            - **Windows (10 / 11):** 
              - Instalador NSIS (`.exe`): Asistente de instalación directa.
              - Instalador MSI (`.msi`): Paquete de instalación para Windows.
            - **macOS:**
              - Apple Silicon (M1/M2/M3/M4): Paquete `.dmg` y `.app`.
              - Intel (x86_64): Paquete `.dmg` y `.app`.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
