name: 'Release EnigmaOS Windows'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'x86_64-pc-windows-msvc'

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build frontend
        run: npm run build

      - name: Build and Release with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'EnigmaOS Windows ${{ github.ref_name }}'
          releaseBody: |
            ### 🚀 EnigmaOS Windows Edition ${{ github.ref_name }}
            
            Descargas oficiales para Windows 10 y Windows 11 (64-bit):
            - **Instalador NSIS (`.exe`):** Asistente interactivo de instalación directa.
            - **Paquete MSI (`.msi`):** Instalador para entornos corporativos y estándar de Windows.
            
            ✨ **Novedades de esta versión (v1.1.14):**
            - **Atajos Globales de Windows Fiables:** Intercepción a bajo nivel mediante gancho `WH_KEYBOARD_LL` con seguimiento preciso de estado: tecla `Win` única para Enigma Launcher (`toggle-launcher`) suprimiendo el menú de inicio nativo; `Alt + 3` para Enigma AI Hub (`toggle-enigma`); `Alt + Espacio` para Búsqueda Notch (`trigger-search` / `open-search`) suprimiendo el menú del sistema Windows (`SC_KEYMENU`); y `Alt + V` para historial de portapapeles.
            - **Inhibición Inteligente de Click-Through:** Control atómico de modo interactivo (`MAIN_INTERACTIVE`, `DOCK_INTERACTIVE`) en el rastreador de ratón para impedir que las ventanas se vuelvan transparentes a los eventos de cursor (`set_ignore_cursor_events`) mientras una vista interactiva esté abierta.
            - **Despersonalización Completa y Perfil Dinámico:** Despersonalización absoluta de todo el código fuente, prompts, memoria persistente SQLite (`enigma_core.md`, personas y scheduler). Personalización dinámica del operador/usuario desde los Ajustes de Enigma Hub con almacenamiento en SQLite (`enigma_settings`).
            - **Detección y Configuración de IA Local Ollama:** Detección de conectividad en doble endpoint (`127.0.0.1` y `localhost`) e interfaz neumórfica para sistemas sin modelos instalados o con Ollama inactivo, con perfiles Básico, Equilibrado, Alto Rendimiento y Personalizado, y botones de ejecución directa en terminal y copia de comandos.
          releaseDraft: false
          prerelease: false
          args: ''
