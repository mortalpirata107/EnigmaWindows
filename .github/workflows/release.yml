name: 'Release EnigmaOS Windows'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'x86_64-pc-windows-msvc'

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build frontend
        run: npm run build

      - name: Build and Release with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'EnigmaOS Windows ${{ github.ref_name }}'
          releaseBody: |
            ### 🚀 EnigmaOS Windows Edition ${{ github.ref_name }}
            
            Descargas oficiales para Windows 10 y Windows 11 (64-bit):
            - **Instalador NSIS (`.exe`):** Asistente interactivo de instalación directa.
            - **Paquete MSI (`.msi`):** Instalador para entornos corporativos y estándar de Windows.
            
            ✨ **Novedades de esta versión:**
            - **Sustitución Nativa de la Barra de Tareas (Modo Seelen UI):** Enigma Dock sustituye limpiamente la barra de tareas de Windows (`Shell_TrayWnd`), con un botón integrado para alternar la barra nativa cuando lo desees.
            - **Conexión 100% Real con el Sistema:** Detección de procesos Win32 en tiempo real (Opera, Chrome, Edge, Spotify, Discord, etc.), escaneo de accesos directos del Menú Inicio (`.lnk`) y ejecución nativa.
            - **Islas Flotantes con Margen Superior de 14px:** Margen superior calibrado y sombras neumórficas sin manchas oscuras para un acabado flotante cristalino.
            - **Aislamiento de Eventos Notch ⇄ Dock:** Eventos de cursor independientes por ventana para evitar que interactuar con el Notch despliegue el Dock inferior.
            - **Soporte NVIDIA Serie RTX 50 (Blackwell):** Integración de perfiles y comandos Ollama para RTX 5090, 5080, 5070 Ti y 5070.
          releaseDraft: false
          prerelease: false
          args: ''
