name: 'Release EnigmaOS Windows'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'x86_64-pc-windows-msvc'

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build frontend
        run: npm run build

      - name: Build and Release with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'EnigmaOS Windows ${{ github.ref_name }}'
          releaseBody: |
            ### 🚀 EnigmaOS Windows Edition ${{ github.ref_name }}
            
            Descargas oficiales para Windows 10 y Windows 11 (64-bit):
            - **Instalador NSIS (`.exe`):** Asistente interactivo de instalación directa.
            - **Paquete MSI (`.msi`):** Instalador para entornos corporativos y estándar de Windows.
            
            ✨ **Novedades de esta versión:**
            - **Detección Precisa del Cursor en el Dock e Histéresis:** Eliminados los fallos de selección de apps y la fuga de clics hacia el escritorio. Introducida histéresis de 160ms, buffer perimetral de 8px y desacoplamiento de drag-and-drop HTML5 con tolerancia a jitter para clics instantáneos.
            - **Extracción de Iconos y Logos Reales de Windows (Win32):** Integración con `WM_GETICON`, `GetClassLongPtrW` y `ExtractIconExW` codificados a PNG 32-bit en tiempo real. Erradicados los recuadros rojos "NA" y los iconos genéricos de KDE para apps de Windows (Settings, Edge, Explorador, Bloc de notas, etc.).
            - **Fallback Automático de Ejecución:** Si una app está en segundo plano o el foco Win32 no responde, el Dock lanza el ejecutable nativamente sin bloquearse.
            - **Modo Sigiloso y Margen Superior para Maximizadas:** Telemetría en memoria sin consolas emergentes y reserva de WorkArea de 38px en la parte superior.
          releaseDraft: false
          prerelease: false
          args: ''
