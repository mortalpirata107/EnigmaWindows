name: 'Release EnigmaOS Windows'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'x86_64-pc-windows-msvc'

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build frontend
        run: npm run build

      - name: Build and Release with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'EnigmaOS Windows ${{ github.ref_name }}'
          releaseBody: |
            ### 🚀 EnigmaOS Windows Edition ${{ github.ref_name }}
            
            Descargas oficiales para Windows 10 y Windows 11 (64-bit):
            - **Instalador NSIS (`.exe`):** Asistente interactivo de instalación directa.
            - **Paquete MSI (`.msi`):** Instalador para entornos corporativos y estándar de Windows.
            
            ✨ **Novedades de esta versión:**
            - **Dock Inteligente 100% Operativo:** Corregido anclaje al borde inferior de la pantalla, activación por cursor y apertura fluida en Windows.
            - **Escritorios Virtuales Nativos:** Soporte para cambiar escritorios en Windows 10 y 11 mediante `Win + Ctrl + Flechas`.
            - **Islas Flotantes con Margen Superior:** La TopBar cuenta siempre con su margen de flotación (`8px`) y esquinas redondeadas.
            - **Diseño Reactivo:** Optimizado para cualquier resolución (1024x768, 1280x720, 1080p, 2K/4K) sin colapsos.
            - **Nuevo Logo Enigma Core:** Escudo hexagonal cibernético con gradiente rubí/carmesí.
          releaseDraft: false
          prerelease: false
          args: ''
