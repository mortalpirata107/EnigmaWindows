name: 'Release EnigmaOS Windows'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'x86_64-pc-windows-msvc'

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build frontend
        run: npm run build

      - name: Build and Release with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'EnigmaOS Windows ${{ github.ref_name }}'
          releaseBody: |
            ### 🚀 EnigmaOS Windows Edition ${{ github.ref_name }}
            
            Descargas oficiales para Windows 10 y Windows 11 (64-bit):
            - **Instalador NSIS (`.exe`):** Asistente interactivo de instalación directa.
            - **Paquete MSI (`.msi`):** Instalador para entornos corporativos y estándar de Windows.
            
            ✨ **Novedades de esta versión:**
            - **Detección 100% Real de Apps Abiertas en Windows:** Filtro exhaustivo de ventanas de nivel superior (IsWindowVisible, descarte de procesos en segundo plano, ventanas cloaked/suspendidas de UWP con DWMWA_CLOAKED, child windows y tool windows sin WS_EX_APPWINDOW). Las aplicaciones en el Dock solo se muestran como abiertas si tienen ventanas reales activas.
            - **Unificación de Tecla Windows y Selector de Apps:** Eliminado el botón duplicado redundante en el Dock. El extremo izquierdo ahora cuenta con un único botón para el selector de apps / Enigma Launcher. Integración de gancho de teclado nativo de bajo nivel (`WH_KEYBOARD_LL`) para capturar la pulsación de la tecla Windows (`VK_LWIN`/`VK_RWIN`) y conmutar el lanzador sustituyendo el menú clásico de Windows.
            - **Integración Nativa Win32 AppBar (Estilo Seelen UI) y Reserva de WorkArea:** Implementado registro formal de AppBar en el Shell de Windows (`SHAppBarMessage` con `ABM_NEW` y `ABM_SETPOS` en `ABE_TOP`) combinado con `SystemParametersInfoW(SPI_SETWORKAREA)` calibrado a 52px (con escalado DPI dinámico) y centinela protector en memoria. Las ventanas maximizadas jamás se solapan ni quedan ocultas detrás del TopBar.
          releaseDraft: false
          prerelease: false
          args: ''
