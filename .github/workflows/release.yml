name: 'Release EnigmaOS Windows'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'x86_64-pc-windows-msvc'

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build frontend
        run: npm run build

      - name: Build and Release with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'EnigmaOS Windows ${{ github.ref_name }}'
          releaseBody: |
            ### 🚀 EnigmaOS Windows Edition ${{ github.ref_name }}
            
            Descargas oficiales para Windows 10 y Windows 11 (64-bit):
            - **Instalador NSIS (`.exe`):** Asistente interactivo de instalación directa.
            - **Paquete MSI (`.msi`):** Instalador para entornos corporativos y estándar de Windows.
            
            ✨ **Novedades de esta versión (v1.1.15):**
            - **Atajos Globales de Windows Reforzados:** Hook de teclado de bajo nivel `WH_KEYBOARD_LL` con inyección de tecla máscara (`0xE8`) para suprimir de forma limpia el menú de inicio sin bloquear modificadores en Windows; soporte nativo dual para tecla '3' superior y numpad 3 (`VK_NUMPAD3`); eliminación de dobles emisiones de eventos para conmutación inmediata de Launcher (`toggle-launcher`), Notch Search (`toggle-search`) y Enigma AI Hub (`toggle-enigma`); activación consistente de foco e interactividad (`set_keyboard_interactivity`).
            - **Perfil Dinámico en Router:** Inyección en tiempo real del nombre del operador configurado en los prompts de Ollama para que la IA siempre se dirija al usuario por su nombre personalizado.
            - **Selector Interactivo de Modelos de Alto Rendimiento:** Selector directo entre `hermes3:8b` y `qwen2.5:14b` en el panel de configuración de Ollama con comandos de ejecución en terminal en 1 clic.
          releaseDraft: false
          prerelease: false
          args: ''
