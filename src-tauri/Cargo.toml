[package]
name = "enigmaos"
version = "1.1.15"
description = "EnigmaOS - AI-Powered Desktop Shell & Intelligence Layer"
authors = ["EnigmaOS Contributors"]
edition = "2021"
default-run = "enigmaos"

[[bin]]
name = "enigmaos"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1.0"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
tauri-plugin-global-shortcut = "2.4.0"
reqwest = { version = "0.13.5", features = ["json", "stream", "blocking", "form", "rustls"] }
futures-util = "0.3.34"
cpal = "0.15"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
notify-rust = "4.11"
chrono = { version = "0.4", features = ["serde"] }
tiny_http = "0.12"
open = "5"
url = "2"
base64 = "0.22"
teloxide = { version = "0.13", features = ["macros"] }
dotenvy = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
gdkx11 = "0.18"
cairo-rs = "0.18"
evdev = "0.12"
zbus = "5.19.0"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
enigo = { version = "0.2", default-features = false, features = ["wayland", "x11rb"] }
vosk = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader"
] }
enigo = { version = "0.2", default-features = false }
arboard = "3.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
enigo = { version = "0.2", default-features = false }
arboard = "3.6.1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
